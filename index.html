<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandeep Muhal — AI/ML Engineer & Data Scientist Portfolio</title>
  <link rel="icon" type="image/jpeg" href="src/assets/sandeep.jpg">
  <meta name="description"
    content="Sandeep Muhal is an AI/ML Engineer and Data Scientist specializing in Machine Learning, Deep Learning, LLMs, Computer Vision, and FastAPI deployments." />
  <meta name="keywords"
    content="AI Engineer, ML Engineer, Data Scientist, Machine Learning, Deep Learning, LLM, RAG, Computer Vision, FastAPI, Flutter, Portfolio" />
  <meta name="author" content="Sandeep Muhal" />
  <meta property="og:title" content="Sandeep Muhal — AI/ML Engineer & Data Scientist" />
  <meta property="og:description" content="Building intelligent AI systems from research to production." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
    // Apply saved theme before React mounts to avoid flash
    (function () {
      try {
        const saved = localStorage.getItem('portfolio-theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (error) {
        console.error('Unable to read the saved theme preference.', error);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
